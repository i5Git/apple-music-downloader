name: Apply quality selector fix

on:
  push:
    branches: [main]
    paths:
      - scripts/apply_quality_selector_fix.py
      - .github/workflows/apply-quality-selector-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply selector patch
        run: python3 scripts/apply_quality_selector_fix.py

      - name: Format and test
        run: |
          gofmt -w internal/parser/m3u8.go
          go test ./...

      - name: Commit patched source
        run: |
          if git diff --quiet -- internal/parser/m3u8.go; then
            echo "No selector changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f internal/parser/m3u8.go
          git commit -m "fix: select exact Apple Music audio quality"
          git push
