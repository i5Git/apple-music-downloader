name: Apply AAC fallback ladder

on:
  push:
    branches: [main]
    paths:
      - scripts/apply_aac_fallback_ladder.py
      - .github/workflows/apply-aac-fallback-ladder.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply fallback patch
        run: python3 scripts/apply_aac_fallback_ladder.py

      - name: Format and compile
        run: |
          gofmt -w internal/parser/m3u8.go
          go build ./...

      - name: Commit
        run: |
          if git diff --quiet -- internal/parser/m3u8.go; then
            echo "No fallback changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f internal/parser/m3u8.go
          git commit -m "fix: add predictable AAC quality fallback ladder"
          git push
